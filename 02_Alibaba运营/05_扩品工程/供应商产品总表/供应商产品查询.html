function source(s,label){return `<p>${esc(label)} ${a(s.url,(s.supplier||'供应商待核')+' / '+(s.model||'原货号待核'))}<br><small>${esc(s.currency)} ${esc(s.price||'原价待核')} · 证据时间 ${esc(s.observed_at||'见原证据')} · ${esc(s.price_terms||'采购条件待核')}</small></p>`}
function render(){const q=$('q').value.trim().toLowerCase(),state=$('state').value;const intent=$('intent').value;const rows=data.filter(p=>(!intent||(p.classification.local_intent_candidates||[]).includes(intent))&&(!state||p.source_state===state)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));$('count').textContent=rows.length+' / '+data.length+' 个组';$('rows').innerHTML=rows.map(p=>`<article><h2>${esc(p.aliases.join(' / '))} <small class="tag">${esc(p.source_label)}</small></h2><p><small>采购意图（状态 ${esc(p.classification.state)}）：${esc((p.classification.local_intent_candidates||[]).join(" / "))} · 平台类目ID ${esc((p.classification.platform_category_ids||[]).join(" / "))} · 店内分组 ${esc((p.classification.store_groups||[]).map(g=>g.name||g.id).join(" / ")||"接口未返回，待核")}</small></p><p>本地入口：${p.local_assets.files.map(f=>`<a href="${esc(f.url)}">${esc(f.path)}</a>`).join("<br>")||"当前档案待指定"}<br><small>${esc(p.local_assets.state)}</small></p><div class="sources">${p.source?source(p.source,p.source_label):''}${p.candidates.map(s=>source(s,'替换候选')).join('')}${!p.source&&!p.candidates.length?'<p class="missing">'+(p.raw_packages.length?'有原始包关联；采购直链待补':'实鞋/采购证据待补')+'</p>':''}</div><p>下一步：${esc(p.next_action)}</p><details><summary>展开 ${p.listings.length} 条关联链接及证据备注</summary><table><thead><tr><th>型号 / 商品ID</th><th>保存的审核/展示</th><th>观察时间与范围</th><th>逐链接来源绑定</th></tr></thead><tbody>${p.listings.map(l=>`<tr><td>${a(l.url,l.model)}<br>${esc(l.id)}</td><td>${esc(l.status)} / ${esc(l.display)}</td><td>${esc(l.observed_at)}<br>${esc(l.scope)}<br>本轮目录：${esc(l.catalog_presence)} · 本地同步：${esc(l.local_sync)}<br>本轮标题：${esc(l.catalog_fields.title||"未检出")}</td><td>${l.source_bound?'有采用记录':'未证明；不自动继承为通过'}</td></tr>`).join('')}</tbody></table><ul>${p.notes.map(n=>'<li>'+esc(n)+'</li>').join('')}</ul><small>${p.evidence.map(esc).join('<br>')}</small></details></article>`).join('')};$('intent').innerHTML+=[...new Set(data.flatMap(p=>p.classification.local_intent_candidates||[]))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('intent').onchange=render;$('q').oninput=render;$('state').onchange=render;render();
</script></html>
