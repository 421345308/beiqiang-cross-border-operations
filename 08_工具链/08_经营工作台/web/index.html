<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贝强 · 经营工作台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="/">BQ<span>贝强经营工作台<small>把下一步，做成实际结果</small></span></a><nav aria-label="主要导航"><button data-view="overview" class="nav active">经营总览</button><button data-view="execute" class="nav">任务执行</button><button data-view="history" class="nav">运行记录</button><button data-view="video" class="nav">视频画布</button><button data-view="alibaba" class="nav">国际站</button></nav><div class="sidebar-bottom"><span class="connection" id="connection">正在连接本地工作台</span><p>本地提案、视频草稿与国际站查询<br>每项操作按实际接入范围执行</p></div></aside><main><header class="topbar"><span id="view-label">经营总览</span><button class="quiet" id="refresh">刷新资料</button></header><div id="notice" role="status" hidden></div><section class="direction"><div><span class="eyebrow">长期方向</span><p id="long-term">正在读取原项目目标…</p></div><div class="phase"><span class="eyebrow">当前阶段</span><p id="phase">读取中</p></div></section><section id="overview-view"><div class="section-heading"><div><span class="eyebrow">来自业务原档案</span><h1>接下来，推进什么</h1></div><span class="subtle">业务进度与 Agent 执行分别记录</span></div><div id="tasks" class="task-grid"></div></section><section id="execute-view" hidden><div class="section-heading"><div><span class="eyebrow">从真实业务开始</span><h1>任务执行</h1></div><span class="model" id="model">Sol</span></div><div class="execution-grid"><section class="card compose"><label for="task-select">选择原业务任务</label><select id="task-select"></select><div id="selected-context" class="context"></div><label for="instruction">这次希望推进什么</label><textarea id="instruction" rows="6" placeholder="例如：阅读当前任务资料，找出阻碍下一步的缺口，提出可审查的原文修订。"></textarea><p class="hint">Sol 读取本地资料并提交提案。确认采纳后，才回写原项目。</p><button id="start" class="primary">启动 Sol</button></section><section class="card runtime"><div class="card-heading"><h2>实际运行</h2><span id="run-status" class="badge">尚未启动</span></div><div id="run-meta" class="subtle"></div><div id="run-log" class="log" aria-live="polite"></div><div id="run-actions" class="actions"></div></section></div><section id="review" class="card review" hidden></section></section><section id="history-view" hidden><div class="section-heading"><div><span class="eyebrow">保存在本地，可继续接续</span><h1>运行记录</h1></div></div><div id="history"></div></section><section id="video-view" hidden></section><section id="alibaba-view" hidden></section><footer>贝强 · 每次推进都回到原项目依据</footer></main></div><dialog id="document-panel"><div class="document-heading"><h2 id="document-title">项目资料</h2><button id="close-document" aria-label="关闭资料">关闭 ✕</button></div><pre id="document-content"></pre></dialog><script src="/app.js" defer></script><script src="/workspace.js" defer></script></body></html>
