<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>镜头拆解台</title><style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#10151d;color:#e5eaf3}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:25px;margin:4px 0}small,.muted{color:#9aabc1}button,select,input,textarea{font:inherit;color:inherit;background:#202c3d;border:1px solid #3c4b60;border-radius:7px;padding:8px}button{cursor:pointer}button:hover,button.active{background:#315581;border-color:#81b5fc}button.primary{background:#276a8f}button:disabled{opacity:.5;cursor:wait}.players{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.pane{background:#18212e;border-radius:12px;overflow:hidden}.label{padding:10px 14px;display:flex;justify-content:space-between}video{display:block;width:100%;aspect-ratio:16/9;background:#070b10}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0}#scrub{width:100%;padding:0;accent-color:#83beff}canvas{width:100%;height:65px;display:block;background:#18212e;border-radius:8px;cursor:pointer}.workspace{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:20px}.panel{padding:18px;background:#18212e;border-radius:12px}h2{font-size:17px;margin:0 0 12px}#list{max-height:490px;overflow:auto;display:grid;gap:6px;margin-top:12px}.shot{text-align:left;display:flex;justify-content:space-between;gap:12px;width:100%;font-size:13px}.shot span{max-width:220px}.range{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.range input{width:92px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notes label{font-size:13px;color:#b8c9df}.notes textarea{display:block;width:100%;min-height:90px;resize:vertical;margin-top:6px;background:#111b28}.wide{grid-column:1/-1}.status{padding:9px 0;min-height:32px;font-size:13px;color:#9bd4b2}#fatal{color:#ffaaaa}footer{margin-top:18px;font-size:12px;color:#94a6bd;line-height:1.8}input[type=checkbox]{accent-color:#80bbff}#source{max-width:100%}@media(max-width:900px){.workspace{grid-template-columns:1fr}.players{gap:8px}body{padding:12px}.notes{grid-template-columns:1fr}h1{font-size:20px}}
</style><body><header><div><small>本地制作工具 · 完整片段对照</small><h1 id="title">镜头拆解台</h1><span class="muted">先看行为与回应，再决定怎样改。</span></div><div><button id="export">导出笔记与片段表</button> <button id="import">导入笔记</button><input id="file" type="file" accept="application/json" hidden></div></header>
<div id="fatal"></div><section class="players"><div class="pane"><div class="label"><b>参考片</b><small id="infoA"></small></div><video id="a" preload="auto" playsinline></video></div><div class="pane"><div class="label"><b>当前制作版</b><small id="infoB"></small></div><video id="b" preload="auto" playsinline muted></video></div></section>
<div class="toolbar"><button id="play" class="primary" disabled>播放两片</button><button id="prev">← 前一帧</button><button id="next">后一帧 →</button><select id="speed" aria-label="播放速度"><option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="1" selected>正常速度</option></select><label><input id="loop" type="checkbox" checked> 循环所选片段</label><select id="audio" aria-label="播放声音"><option value="a">听参考片</option><option value="b">听当前版</option><option value="none">静音</option></select><button id="whole">查看全片</button><b id="time">00:00.000</b><small id="sync"></small></div>
<input id="scrub" aria-label="时间线" type="range" min="0" max="56" step="0.001" value="0"><canvas id="wave" width="1400" height="65" aria-label="参考片声音幅度与画面切换候选"></canvas>
<section class="workspace"><aside class="panel"><h2>片段导航</h2><select id="source"><option value="chapters">已有剧情段落 · 待复核</option><option value="reference">参考片 · 自动切镜候选</option><option value="candidate">当前版 · 自动切镜候选</option><option value="custom">自定义片段</option></select><p id="hint" class="muted" style="font-size:12px"></p><button id="new">把当前区间保存为自定义片段</button><div id="list"></div></aside>
<article class="panel"><h2 id="shotTitle">全片</h2><div class="range"><label>开始 <input id="start" type="number" min="0" step="0.001" value="0"></label><label>结束 <input id="end" type="number" min="0" step="0.001" value="56"></label><button id="range">应用区间</button><label>当前版偏移 <input id="offset" type="number" step="0.001" value="0"> 秒</label></div>
<p class="muted" style="font-size:12px">偏移为正：当前版播放位置比参考片向后。两片长度不同时请逐段对齐。左右键逐帧，空格播放。</p>
<div class="notes"><label>这一段要让观众感受到什么<textarea data-field="purpose" placeholder="先写情绪变化，不只写发生了什么"></textarea></label><label>人物动机与选择<textarea data-field="motivation" placeholder="他/她为什么在这一刻行动？"></textarea></label><label>动作、回应与视线<textarea data-field="response" placeholder="谁先行动？另一个人如何察觉和回应？"></textarea></label><label>节奏与留白<textarea data-field="timing" placeholder="哪里太急、太平均，哪里应该停住？"></textarea></label><label>看见/听见的证据<textarea data-field="evidence" placeholder="记录具体时间点；与推测分开"></textarea></label><label>修改假设与验证方法<textarea data-field="change" placeholder="只改变什么？怎样对照才算改善？"></textarea></label></div><div id="saveStatus" class="status"></div></article></section>
<footer>自动切镜是画面变化候选，不等于剧情理解。已有剧情段落来自工程记录，可能与原片切点不同。波形表示声音幅度，不等于节拍或情绪判断。网页逐帧定位用于制作参考，精确帧与导出仍以 FFmpeg 为准。笔记保存在此浏览器；跨电脑或长期留存请导出。</footer>
<script>
const $=id=>document.getElementById(id),a=$('a'),b=$('b');
let data,store,key,active='whole',range={start:0,end:56},offset=0,playing=false,ready=false;
const stamp=t=>{t=Math.max(0,t);return `${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(3).padStart(6,'0')}`};
function persist(){try{localStorage.setItem(key,JSON.stringify(store));$('saveStatus').textContent='已保存在本机浏览器 · 导出后可长期留存';}catch(e){$('saveStatus').textContent='浏览器保存失败，请立即导出笔记';}}
function note(){return store.notes[active]??={};}
function saveNote(){const n=note();document.querySelectorAll('[data-field]').forEach(el=>n[el.dataset.field]=el.value);n.range={...range};n.offset=offset;persist();}
function loadNote(){const n=note();document.querySelectorAll('[data-field]').forEach(el=>el.value=n[el.dataset.field]||'');}
function pause(){a.pause();b.pause();playing=false;$('play').textContent='播放两片';}
function seek(t){t=Math.max(0,Math.min(data.media.reference.duration,t));a.currentTime=t;b.currentTime=Math.max(0,Math.min(data.media.candidate.duration,t+offset));$('scrub').value=t;draw();}
async function play(){if(!ready)return;if(playing){pause();return;}if(a.currentTime<range.start||a.currentTime>=range.end-.02)seek(range.start);b.currentTime=Math.max(0,a.currentTime+offset);try{await Promise.all([a.play(),b.play()]);playing=true;$('play').textContent='暂停两片';}catch(e){pause();$('fatal').textContent='播放失败：'+e.message;}}
function setRange(s,e,title,id){pause();range={start:s,end:e};active=id;$('start').value=s.toFixed(3);$('end').value=e.toFixed(3);$('shotTitle').textContent=title;const n=note();if(n.range&&Number.isFinite(n.range.start)&&Number.isFinite(n.range.end)&&n.range.start>=0&&n.range.end>n.range.start&&n.range.end<=data.media.reference.duration){range={...n.range};$('start').value=range.start.toFixed(3);$('end').value=range.end.toFixed(3);}offset=Number.isFinite(n.offset)?n.offset:0;$('offset').value=offset;loadNote();seek(range.start);document.querySelectorAll('.shot').forEach(el=>el.classList.toggle('active',el.dataset.id===id));}
function items(){const src=$('source').value;return src==='chapters'?data.chapters:src==='custom'?store.custom:data.media[src].cuts;}
function renderList(){const src=$('source').value;$('list').replaceChildren();$('hint').textContent=src==='chapters'?'已有工程的剧情范围；标题是既有解读，需结合完整片段复核。':src==='custom'?'自定义片段可随笔记导出，原始视频不会被修改。':'自动检测可能漏掉渐变，也可能把闪光识别为切镜。';items().forEach((s,i)=>{const el=document.createElement('button');el.className='shot';el.dataset.id=`${src}:${i}`;const text=document.createElement('span');text.textContent=`${i+1}. ${s.meaning||s.name||'画面段落'}`;const time=document.createElement('small');time.textContent=`${s.start.toFixed(2)}–${s.end.toFixed(2)}s`;el.append(text,time);el.onclick=()=>setRange(s.start,s.end,text.textContent,el.dataset.id);$('list').append(el);});draw();}
function draw(){if(!data)return;const c=$('wave'),ctx=c.getContext('2d'),w=c.width,h=c.height,d=data.media.reference.duration;ctx.clearRect(0,0,w,h);ctx.fillStyle='#244363';ctx.fillRect(range.start/d*w,0,(range.end-range.start)/d*w,h);const peaks=data.media.reference.waveform,max=Math.max(.001,...peaks);ctx.fillStyle='#6f93b5';peaks.forEach((p,i)=>{const y=p/max*25;ctx.fillRect(i/peaks.length*w,h/2-y,Math.max(1,w/peaks.length),y*2)});ctx.fillStyle='#f2c67c';data.media.reference.cuts.slice(1).forEach(s=>ctx.fillRect(s.start/d*w,0,1,12));ctx.fillStyle='#f3f7ff';ctx.fillRect(a.currentTime/d*w,0,2,h);$('time').textContent=stamp(a.currentTime);}
function tick(){if(ready&&playing){if(playing){if(a.currentTime>=range.end-.025){if($('loop').checked){seek(range.start);}else{pause();seek(range.end);}}const target=a.currentTime+offset;if(target>=0&&target<b.duration&&Math.abs(b.currentTime-target)>.09)b.currentTime=target;} $('scrub').value=a.currentTime;$('sync').textContent=`两片位置差 ${(b.currentTime-a.currentTime-offset).toFixed(3)} 秒`;draw();}requestAnimationFrame(tick);}
$('play').onclick=play;$('prev').onclick=()=>{pause();seek(a.currentTime-1/data.media.reference.fps)};$('next').onclick=()=>{pause();seek(a.currentTime+1/data.media.reference.fps)};
$('scrub').oninput=e=>{pause();seek(+e.target.value)};$('wave').onclick=e=>{pause();seek((e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.clientWidth*data.media.reference.duration)};
$('speed').onchange=e=>a.playbackRate=b.playbackRate=+e.target.value;
$('audio').onchange=e=>{a.muted=e.target.value!=='a';b.muted=e.target.value!=='b'};
$('source').onchange=renderList;$('whole').onclick=()=>setRange(0,data.media.reference.duration,'全片','whole');
$('range').onclick=()=>{const s=+$('start').value,e=+$('end').value;if(s>=0&&e>s&&e<=data.media.reference.duration){range={start:s,end:e};saveNote();pause();seek(s)}else alert('区间应在视频内，结束时间需大于开始时间。')};
$('offset').onchange=e=>{offset=+e.target.value;pause();seek(a.currentTime);saveNote()};
$('new').onclick=()=>{const name=prompt('片段名称');if(!name)return;store.custom.push({...range,name});persist();$('source').value='custom';renderList();setRange(range.start,range.end,name,`custom:${store.custom.length-1}`)};
document.querySelectorAll('[data-field]').forEach(el=>el.oninput=saveNote);
$('export').onclick=()=>{saveNote();const payload={schema:'shot-workbench-notes/1',sources:{reference:data.media.reference.sha256,candidate:data.media.candidate.sha256},...store};const link=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));link.href=url;link.download='镜头笔记与片段表.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.schema!=='shot-workbench-notes/1'||x.sources.reference!==data.media.reference.sha256||x.sources.candidate!==data.media.candidate.sha256)throw Error('笔记对应的视频版本不匹配');if(!x.notes||typeof x.notes!=='object'||!Array.isArray(x.custom))throw Error('笔记结构不正确');if(x.custom.some(s=>!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.start<0||s.end<=s.start||s.end>data.media.reference.duration))throw Error('片段范围无效');if(!confirm('导入将替换此版本在浏览器中的现有笔记，继续？'))return;store={notes:x.notes,custom:x.custom};persist();loadNote();renderList();}catch(err){alert(err.message)}finally{e.target.value=''}};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();play()}if(e.code==='ArrowLeft')$('prev').click();if(e.code==='ArrowRight')$('next').click()});
async function boot(){try{data=await(await fetch('data.json')).json();$('title').textContent=data.title;document.title=data.title;key='shot-workbench:'+data.media.reference.sha256+':'+data.media.candidate.sha256;try{store=JSON.parse(localStorage.getItem(key))}catch{}store??={notes:{},custom:[]};range.end=data.media.reference.duration;$('end').value=range.end;$('scrub').max=range.end;const loaded=[a,b].map((v,i)=>new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=()=>reject(Error('视频无法解码'));v.src=data.media[i?'candidate':'reference'].file;}));await Promise.all(loaded);ready=true;$('play').disabled=false;$('infoA').textContent=`${a.duration.toFixed(2)}秒 · ${data.media.reference.fps}fps`;$('infoB').textContent=`${b.duration.toFixed(2)}秒 · ${data.media.candidate.fps}fps`;renderList();loadNote();tick();}catch(e){$('fatal').textContent='载入失败：'+e.message;}}boot();
</script></body></html>
