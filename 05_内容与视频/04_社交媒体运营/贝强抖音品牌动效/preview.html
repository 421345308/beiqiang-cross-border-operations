<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>贝强 · 把灵感织进每一步</title>
<style>
body{margin:0;background:#201f1d;color:#eee9df;font-family:'Microsoft YaHei',sans-serif}
main{max-width:1120px;margin:32px auto;padding:0 24px}h1{font-size:26px;font-weight:500;letter-spacing:3px}
p{color:#b8b1a5;font-size:14px;line-height:1.8}section{display:flex;gap:32px;align-items:flex-start}
video{height:76vh;max-height:780px;max-width:100%;background:#eee6d9;border-radius:4px}.side{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid img{width:100%;border-radius:4px}
.grid span{display:block;font-size:13px;margin:10px 0;color:#c8c0b2}
button,a{background:#e9ddc7;color:#3e352b;border:0;border-radius:4px;padding:12px 18px;margin:5px 6px 5px 0;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.secondary{background:#34312b;color:#d4c7b0}.notes{margin:24px 0;color:#d7cebf;line-height:2;font-size:15px}
small{display:block;color:#a9a296;line-height:1.8;margin-top:20px}
@media(max-width:720px){section{display:block}video{height:65vh}.side{margin-top:22px}}
</style>
<main>
<h1>贝强 · 把灵感织进每一步</h1>
<p id="version">完整版 / 32 秒 / 竖屏</p>
<section>
<video id="film" aria-label="贝强品牌片" controls playsinline preload="auto" poster="out/贝强_抖音封面.png" src="out/贝强_把灵感织进每一步_完整版.mp4"></video>
<div class="side">
<div class="grid"><div><img src="out/完整版_开场检查.png"><span>01 鞋形开场</span></div><div><img src="out/贝强_抖音封面.png"><span>02 品牌封面</span></div><div><img src="out/完整版_收尾检查.png"><span>03 品牌收尾</span></div></div>
<div class="notes">把灵感，织进每一步。<br>六段画面 · 原创配乐 · 公司全称收尾。<br>视频与封面可以分别保存。</div>
<button onclick="selectV2();film.currentTime=0;film.play()">播放完整版</button>
<a href="out/贝强_把灵感织进每一步_完整版.mp4" download>保存完整视频</a>
<div><button class="secondary" onclick="seekV2(1.6)">鞋形开场</button><button class="secondary" onclick="seekV2(5.5)">织纹微距</button><button class="secondary" onclick="seekV2(16.4)">细节特写</button><button class="secondary" onclick="seekV2(30.5)">品牌收尾</button></div>
<button class="secondary" onclick="film.src='out/贝强_三种风格动效试稿.mp4';film.poster='out/暖白排版.png';document.querySelector('#version').textContent='第一版 / 18 秒 / 三种风格比较';film.play()">回看第一版</button>
<a class="secondary" href="out/贝强_抖音封面.png" download>保存抖音封面</a><small>发布文案：把灵感，织进每一步。<br>一缕灵感，一种风格。这里是贝强。<br>#贝强鞋业 #鞋履美学 #品牌短片</small>
</div>
</section>
</main>
<script>
function selectV2(){if(!film.getAttribute('src').includes('完整版')){film.src='out/贝强_把灵感织进每一步_完整版.mp4';film.poster='out/贝强_抖音封面.png'}document.querySelector('#version').textContent='完整版 / 32 秒 / 竖屏'}
function seekV2(t){selectV2();if(film.readyState<1)film.addEventListener('loadedmetadata',()=>{film.currentTime=t;film.pause()},{once:true});else{film.currentTime=t;film.pause()}}
</script>
</html>
